<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1</title>
    <link rel="stylesheet" href="css/practic2.css">
</head>
<body>
    <body class="laborator1">
    <nav>
        <a href="laboratory.html">Повернутися до списку лабораторних</a>
    </nav>
    <h1>Форма реєстрації</h1>
    <p>заповніть форму для реєстрації</p>
    <h2>__</h2>
    <form action="https://webhook.site/92a44386-f4b4-44c3-b55c-e7e74650ccd6" method="POST">
        <div class="form-group">
            <label for="firstname" class="required">Ім'я користувача</label>
            <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="Введіть ваше ім'я"
                required>
        </div>

        <div class="form-group">
            <label for="lastname" class="required">Прізвище користувача</label>
            <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Введіть ваше Прізвище"
                required>
        </div>

        <div class="form-group">
            <label for="email" class="required">Електронна пошта</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required>
        </div>

        <div class="form-group">
            <label for="password" class="required">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Введіть пароль"
                required>
        </div>

        <div class="form-group">
            <label for="password_confirm" class="required">Підтвердження паролю</label>
            <input 
                type="password"
                id="password_confirm"
                name="password_confirm"
                placeholder="Підтвердіть пароль"
                required>
        </div>

        <div class="form-group">
            <label for="date">Дата народження</label>
            <input 
                type="date"
                id="date"
                name="date">
        </div>

        <div class="form-group">
            <label>Відправити</label>
                <button type="submit">Зареєструватися</button>
        </div>
    </form>
</body>
</html>
