<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1</title>
</head>
<body>
    <nav>
        <a href="laboratory.html">Повернутися до списку лабораторних</a>
    </nav>
    <h1>Форма реєстрації</h1>
    <form action="https://webhook.site/b4c8e8bc-5028-43f1-8e40-1898bd82d7c1" method="POST">
        <div class="form-group">
            <label for="firstname">Ім'я користувача</label>
            <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="Введіть ваше ім'я"
                required>
        </div>

        <div class="form-group">
            <label for="lastname">Прізвище користувача</label>
            <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Введіть ваше Прізвище"
                required>
        </div>

        <div class="form-group">
            <label for="email">Електронна пошта</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Введіть пароль"
                required>
        </div>

        <div class="form-group">
            <label for="password_confirm">Підтвердження паролю</label>
            <input 
                type="password"
                id="password_confirm"
                name="password_confirm"
                placeholder="Підтвердіть пароль"
                required>
        </div>

        <div class="form-group">
            <label for="date">Дата народження</label>
            <input 
                type="date"
                id="date"
                name="date">
        </div>

        <div class="form-group">
            <label>Відправити</label>
            <input type="submit" value="зареєструватися">
        </div>
    </form>
</body>
</html>
