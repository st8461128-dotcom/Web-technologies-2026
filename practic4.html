<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична №4</title>
    <link rel="stylesheet" href="css/practic4.css">
</head>
<body>
  <div class="keyboard-case">
    <div class="top-row">
      <button class="key">Esc</button>
      <div class="f-keys">
        <div class="group"><button class="key">F1</button><button class="key">F2</button><button class="key">F3</button><button class="key">F4</button></div>
        <div class="group"><button class="key">F5</button><button class="key">F6</button><button class="key">F7</button><button class="key">F8</button></div>
        <div class="group"><button class="key">F9</button><button class="key">F10</button><button class="key">F11</button><button class="key">F12</button></div>
      </div>
      <div class="system-keys">
        <button class="key small-text">Stamp<br>R Sist</button>
        <button class="key small-text">Bloc<br>Scorr</button>
        <button class="key small-text">Pausa<br>Interr</button>
      </div>
      <div class="status-indicators">
        <div class="indicator">
          <span>1</span>
          <i class="led"></i>
        </div>
        <div class="indicator">
          <span>A</span>
          <i class="led"></i>
        </div>
        <div class="indicator">
          <span>↓</span>
          <i class="led"></i>
        </div>
      </div>
    </div>
    
    <div class="main-keyboard">
      <div class="section main-section">
        <button class="key">\</button>
        <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">4</button>
        <button class="key">5</button><button class="key">6</button><button class="key">7</button><button class="key">8</button>
        <button class="key">9</button><button class="key">0</button><button class="key">?</button><button class="key">^</button>
        <button class="key key-backspace">←</button>

        <button class="key key-tab">Tab ↹</button>
        <button class="key">Q</button><button class="key">W</button><button class="key">E</button><button class="key">R</button>
        <button class="key">T</button><button class="key">Y</button><button class="key">U</button><button class="key">I</button>
        <button class="key">O</button><button class="key">P</button><button class="key">[</button><button class="key">]</button>
        <button class="key key-enter">Invio ↵</button>

        <button class="key key-caps">Caps Lock</button>
        <button class="key">A</button><button class="key">S</button><button class="key">D</button><button class="key">F</button>
        <button class="key">G</button><button class="key">H</button><button class="key">J</button><button class="key">K</button>
        <button class="key">L</button><button class="key">;</button><button class="key">'</button><button class="key">#</button>

        <button class="key key-lshift">⇧</button>
        <button class="key">&lt;</button><button class="key">Z</button><button class="key">X</button><button class="key">C</button>
        <button class="key">V</button><button class="key">B</button><button class="key">N</button><button class="key">M</button>
        <button class="key">,</button><button class="key">.</button><button class="key">-</button>
        <button class="key key-rshift">⇧</button>

        <button class="key key-ctrl">Ctrl</button>
        <button class="key key-win"></button>
        <button class="key key-alt">Alt</button>
        <button class="key key-space"></button>
        <button class="key key-alt">Alt Gr</button>
        <button class="key key-win"></button>
        <button class="key key-menu">▤</button>
        <button class="key key-ctrl">Ctrl</button>
      </div>

      <div class="section nav-section">
        <div class="nav-cluster">
          <button class="key">Ins</button><button class="key">↖</button><button class="key">Pag ↑</button>
          <button class="key">Canc</button><button class="key">Fine</button><button class="key">Pag ↓</button>
        </div>
        <div class="arrow-cluster">
          <div class="l"></div><button class="key">↑</button><div class="r"></div>
          <button class="key">←</button><button class="key">↓</button><button class="key">→</button>
        </div>
      </div>

      <div class="section numpad-section">
        <button class="key">Bloc Num</button><button class="key">/</button><button class="key">*</button><button class="key">-</button>
        <button class="key">7</button><button class="key">8</button><button class="key">9</button>
        <button class="key num-plus">+</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button>
        <button class="key">1</button><button class="key">2</button><button class="key">3</button>
        <button class="key num-enter">Invio</button>
        <button class="key num-zero">0</button><button class="key">.</button>
      </div>
    </div>
  </div>
</body>
</html>
